<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a2f">
<title>ลงทะเบียน · OAC KKT REUNION DAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME ============ */
:root{
  --bg:#081627; --bg2:#0b1f38; --card:#0f2745; --card2:#123055;
  --line:rgba(201,162,75,.22); --line-soft:rgba(180,200,225,.12);
  --gold:#c9a24b; --gold-2:#e7c980; --gold-dim:#8f7636;
  --text:#eef3fa; --dim:#9fb4d0; --faint:#6c85a4;
  --ok:#5fb98e; --ok-bg:rgba(95,185,142,.14);
  --warn:#e6b366; --warn-bg:rgba(230,179,102,.14);
  --bad:#e5766b; --bad-bg:rgba(229,118,107,.14);
  --radius:16px; --radius-sm:11px;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --maxw:520px;
  --font:"Noto Sans Thai","Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  line-height:1.55; font-size:15.5px; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -8%, rgba(201,162,75,.13), transparent 60%),
    radial-gradient(900px 700px at -12% 12%, rgba(58,110,165,.20), transparent 58%),
    linear-gradient(180deg,#081627 0%,#0a1c33 45%,#081426 100%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:3px 3px; mix-blend-mode:overlay;
}
a{color:var(--gold-2);text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(201,162,75,.32)}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(201,162,75,.28);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 120px;position:relative}
.wrap.wide{max-width:1180px}
.topbar{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(8,20,38,.92),rgba(8,20,38,.55));
  border-bottom:1px solid var(--line-soft);
}
.topbar .row{max-width:var(--maxw);margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:11px}
.wide .topbar .row,.topbar .row.wide{max-width:1180px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px;font-size:14px}
.brand img{width:30px;height:30px;filter:drop-shadow(0 2px 8px rgba(201,162,75,.4))}
.brand small{display:block;font-weight:400;color:var(--faint);font-size:10.5px;letter-spacing:1.6px}
.topbar .spacer{flex:1}
.linkbtn{
  background:transparent;border:1px solid var(--line);color:var(--gold-2);
  padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.2s;
}
.linkbtn:hover{background:rgba(201,162,75,.12);border-color:var(--gold)}

/* ============ HERO / HOME ============ */
.hero{padding:30px 0 10px;text-align:center;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero .crest{
  width:118px;height:118px;margin:0 auto 14px;
  filter:drop-shadow(0 8px 30px rgba(201,162,75,.35));
  animation:floaty 6s ease-in-out infinite;
}
.eyebrow{
  font-size:11px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;
  margin-bottom:10px;font-weight:600;
}
.hero h1{
  font-size:clamp(27px,7.6vw,38px);line-height:1.12;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(120deg,#fff 10%,var(--gold-2) 55%,var(--gold) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .sub{color:var(--dim);margin-top:10px;font-size:14px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px 0;opacity:.7}

.factgrid{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
.fact{
  display:flex;gap:13px;align-items:flex-start;
  background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 15px;
  animation:rise .6s both;
}
.fact .ic{font-size:20px;line-height:1;filter:saturate(1.2)}
.fact b{display:block;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:3px;font-weight:600}
.fact span{color:var(--text);font-size:14.5px}
.fact small{color:var(--faint)}

.timeline{margin:8px 0 4px;position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),transparent)}
.tl{position:relative;padding:8px 0 8px 4px;animation:fadein .5s both}
.tl::before{content:"";position:absolute;left:-22.5px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,75,.16)}
.tl .t{font-weight:700;color:var(--gold-2);font-size:13px;letter-spacing:.5px}
.tl .d{color:var(--dim);font-size:13.5px}

/* ============ CARD / STEP ============ */
.card{
  background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;box-shadow:var(--shadow);
}
.card + .card{margin-top:14px}
.step{animation:swap .45s cubic-bezier(.2,.7,.2,1) both}
.step h2{font-size:19px;font-weight:700;letter-spacing:.4px;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.step h2 .n{
  width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;
  background:rgba(201,162,75,.16);color:var(--gold-2);font-size:13px;font-weight:700;
}
.step .hint{color:var(--faint);font-size:13px;margin-bottom:16px}

.progress{display:flex;gap:6px;margin:18px 0 4px}
.progress i{height:4px;flex:1;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
.progress i.on::after,.progress i.done::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.progress i.on::after{animation:grow .5s ease both}

/* ============ FORM ============ */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.field label .req{color:var(--gold-2)}
.inp,.sel,.ta{
  width:100%;background:rgba(4,12,24,.55);border:1px solid var(--line-soft);
  border-radius:11px;padding:13px 14px;font-size:15.5px;transition:.18s;outline:none;
}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--gold);background:rgba(4,12,24,.8);box-shadow:0 0 0 3px rgba(201,162,75,.14)}
.ta{resize:vertical;min-height:74px}
.inp::placeholder,.ta::placeholder{color:#496283}
.inp[readonly]{opacity:.75}
.err{color:var(--bad);font-size:12px;margin-top:6px;display:none}
.field.invalid .err{display:block}
.field.invalid .inp,.field.invalid .sel{border-color:var(--bad)}

/* combobox */
.combo{position:relative}
.combo-list{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;max-height:290px;overflow:auto;
  background:#0c2038;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  display:none;
}
.combo-list.open{display:block;animation:fadein .16s both}
.opt{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:.12s}
.opt:last-child{border-bottom:0}
.opt:hover,.opt.active{background:rgba(201,162,75,.13)}
.opt .nm{font-weight:600}
.opt .meta{font-size:11.5px;color:var(--faint);margin-top:1px}
.opt mark{background:transparent;color:var(--gold-2);font-weight:700}
.opt.addnew{color:var(--gold-2);font-weight:600}

/* choice pills */
.choices{display:grid;gap:9px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{
  border:1px solid var(--line-soft);border-radius:12px;padding:13px 14px;cursor:pointer;
  display:flex;align-items:center;gap:11px;transition:.16s;background:rgba(4,12,24,.4);
}
.choice:hover{border-color:var(--line)}
.choice.sel{border-color:var(--gold);background:rgba(201,162,75,.12);box-shadow:0 0 0 3px rgba(201,162,75,.1)}
.choice .dot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--faint);transition:.16s;position:relative}
.choice.sel .dot{border-color:var(--gold)}
.choice.sel .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}
.choice .cx b{display:block;font-size:14.5px}
.choice .cx small{color:var(--faint);font-size:12px}

/* stepper */
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:rgba(201,162,75,.1);color:var(--gold-2);font-size:20px;cursor:pointer;transition:.15s;
}
.stepper button:active{transform:scale(.92)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .val{font-size:22px;font-weight:700;min-width:34px;text-align:center}

/* size grid */
.sizegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sizegrid .sz{
  border:1px solid var(--line-soft);border-radius:10px;padding:11px 4px;text-align:center;
  cursor:pointer;transition:.15s;background:rgba(4,12,24,.4);font-weight:700;font-size:14px;
}
.sizegrid .sz small{display:block;font-weight:400;color:var(--faint);font-size:10px;margin-top:2px}
.sizegrid .sz.sel{border-color:var(--gold);background:rgba(201,162,75,.14);color:var(--gold-2)}

.extra-row{display:flex;align-items:center;gap:10px;margin-top:9px}
.extra-row .sel{flex:1}
.chip-btn{border:1px dashed var(--line);background:transparent;color:var(--gold-2);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px;width:100%;transition:.15s}
.chip-btn:hover{background:rgba(201,162,75,.1)}
.del-x{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);cursor:pointer;font-size:16px}

/* summary / price */
.pricebox{
  border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:6px;
  background:linear-gradient(180deg,rgba(201,162,75,.08),transparent);
}
.pricebox .l{display:flex;justify-content:space-between;font-size:13.5px;color:var(--dim);padding:3px 0}
.pricebox .l.total{color:var(--text);font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:7px;padding-top:9px}
.pricebox .l.total b{color:var(--gold-2)}

.note-line{font-size:12.5px;color:var(--faint);margin-top:8px;display:flex;gap:7px;align-items:flex-start}
.note-line::before{content:"›";color:var(--gold)}

/* ============ BUTTONS ============ */
.btnrow{display:flex;gap:10px;margin-top:20px}
.btn{
  flex:1;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:700;
  cursor:pointer;transition:.16s;letter-spacing:.5px;position:relative;overflow:hidden;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(120deg,var(--gold),var(--gold-2));color:#241c07;box-shadow:0 12px 30px -12px rgba(201,162,75,.7)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line-soft);flex:0 0 auto;padding:14px 20px}
.btn.ghost:hover{border-color:var(--line)}
.btn.wide{width:100%;flex:none}
.btn[disabled]{opacity:.55;cursor:progress}
.btn .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#241c07;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}

/* ============ SUCCESS / CARD ============ */
.ticket{
  border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(160deg,#0f2745,#0a1b31);box-shadow:var(--shadow);
  animation:rise .6s both;
}
.ticket .th{
  padding:16px 18px;background:linear-gradient(120deg,rgba(201,162,75,.18),transparent);
  border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:12px;
}
.ticket .th img{width:38px;height:38px}
.ticket .th b{font-size:14px;letter-spacing:1px}
.ticket .th small{display:block;color:var(--faint);font-size:10px;letter-spacing:2px}
.ticket .qrwrap{padding:22px;text-align:center}
.ticket .qrbox{width:210px;height:210px;margin:0 auto;background:#fff;border-radius:14px;padding:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.ticket .qrbox svg{width:100%;height:100%;display:block}
.ticket .regid{margin-top:14px;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold-2)}
.ticket .who{color:var(--dim);font-size:14px}
.ticket .trows{padding:4px 18px 20px}
.trow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.trow:last-child{border-bottom:0}
.trow span{color:var(--faint)}
.trow b{text-align:right;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.gold{background:rgba(201,162,75,.16);color:var(--gold-2)}

.success-hd{text-align:center;padding:14px 0 4px;animation:rise .5s both}
.success-hd .tick{
  width:66px;height:66px;margin:0 auto 12px;border-radius:50%;
  background:var(--ok-bg);display:grid;place-items:center;
  border:1px solid rgba(95,185,142,.4);
}
.success-hd .tick svg{width:32px;height:32px;stroke:var(--ok);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .2s forwards}
.success-hd h2{font-size:22px;font-weight:700}
.success-hd p{color:var(--dim);font-size:13.5px;margin-top:4px}

/* ============ PAYMENT ============ */
.pay-qr-card{
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0c2038;margin-top:8px;
}
.pay-qr-card .pp-top{background:#0a4a8f;color:#fff;text-align:center;padding:9px;font-size:12px;letter-spacing:2px;font-weight:700}
.pay-qr-card .pp-mid{background:#fff;padding:18px;text-align:center}
.pay-qr-card .pp-mid svg{width:210px;height:210px;margin:0 auto}
.pay-qr-card .pp-amt{color:#0a1b31;font-weight:700;font-size:18px;margin-top:8px}
.pay-qr-card .pp-bot{padding:12px 14px;font-size:12.5px;color:var(--dim);text-align:center}
.pay-qr-card .pp-bot b{color:var(--gold-2)}
.filebtn{
  border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;
  color:var(--gold-2);font-size:13.5px;transition:.15s;background:rgba(201,162,75,.05);
}
.filebtn:hover{background:rgba(201,162,75,.1)}
.filebtn.has{border-style:solid;color:var(--ok);border-color:rgba(95,185,142,.5)}
.slip-prev{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-height:220px}
.slip-prev img{width:100%;object-fit:contain;max-height:220px}

/* ============ ADMIN ============ */
.adm-tabs{display:flex;gap:6px;overflow:auto;padding:6px 0 12px;-webkit-overflow-scrolling:touch}
.adm-tabs button{
  white-space:nowrap;border:1px solid var(--line-soft);background:rgba(255,255,255,.03);
  color:var(--dim);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;
}
.adm-tabs button.on{background:linear-gradient(120deg,var(--gold),var(--gold-2));color:#241c07;border-color:transparent}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{
  background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:14px;padding:15px 16px;animation:rise .5s both;
}
.kpi .v{font-size:30px;font-weight:800;color:var(--gold-2);letter-spacing:.5px;line-height:1}
.kpi .k{color:var(--dim);font-size:12px;margin-top:6px;letter-spacing:.4px}
.kpi .sub{color:var(--faint);font-size:11px;margin-top:3px}

.panel{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h3{font-size:14px;letter-spacing:.5px;margin-bottom:12px;color:var(--gold-2);display:flex;align-items:center;gap:8px}
.panel h3 .exp{margin-left:auto;display:flex;gap:6px}
.mini{border:1px solid var(--line);background:rgba(201,162,75,.08);color:var(--gold-2);border-radius:8px;padding:6px 10px;font-size:11.5px;cursor:pointer;transition:.15s}
.mini:hover{background:rgba(201,162,75,.16)}

.barrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.barrow .lb{width:64px;flex:none;color:var(--dim)}
.barrow .track{flex:1;height:22px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}
.barrow .fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-2));border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.barrow .vv{width:58px;flex:none;text-align:right;font-weight:700}

.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:none}
.donut .lg{font-size:12.5px}
.donut .lg div{display:flex;align-items:center;gap:8px;padding:3px 0}
.donut .lg i{width:11px;height:11px;border-radius:3px;flex:none}

table.grid{width:100%;border-collapse:collapse;font-size:13px}
.tablescroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-soft);border-radius:12px}
table.grid th,table.grid td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.grid th{background:rgba(201,162,75,.09);color:var(--gold-2);font-size:11.5px;letter-spacing:.6px;position:sticky;top:0}
table.grid tr:hover td{background:rgba(255,255,255,.03)}
table.grid td.act{display:flex;gap:6px}
.rowbtn{border:1px solid var(--line-soft);background:transparent;color:var(--dim);border-radius:7px;padding:5px 9px;font-size:11.5px;cursor:pointer;transition:.14s}
.rowbtn:hover{border-color:var(--gold);color:var(--gold-2)}
.rowbtn.danger:hover{border-color:var(--bad);color:var(--bad)}

.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar .inp{flex:1}

/* scanner */
.scanwrap{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:360px;margin:0 auto}
.scanwrap video{width:100%;height:100%;object-fit:cover}
.scanwrap .frame{position:absolute;inset:14%;border:2px solid var(--gold-2);border-radius:16px;box-shadow:0 0 0 100vh rgba(0,0,0,.35)}
.scanwrap .laser{position:absolute;left:14%;right:14%;height:2px;background:var(--gold-2);box-shadow:0 0 12px var(--gold-2);animation:scanline 2.4s ease-in-out infinite}
.scan-result{margin-top:14px;text-align:center}

/* checkin card */
.ci-person{
  border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;
  background:linear-gradient(180deg,rgba(201,162,75,.1),transparent);animation:pop .3s both;
}
.ci-person .nm{font-size:20px;font-weight:700}
.ci-person .mt{color:var(--dim);font-size:13px;margin-top:3px}
.ci-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ci-btn{border:1px solid var(--line);border-radius:12px;padding:15px;cursor:pointer;transition:.15s;background:rgba(4,12,24,.4);text-align:center}
.ci-btn:hover{border-color:var(--gold)}
.ci-btn.done{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.ci-btn b{display:block;font-size:15px}
.ci-btn small{color:var(--faint);font-size:11.5px}
.ci-btn.done small{color:var(--ok)}

/* toast + modal */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
  background:#0c2038;border:1px solid var(--line);border-radius:12px;padding:13px 18px;
  font-size:13.5px;z-index:200;box-shadow:var(--shadow);max-width:90vw;transition:.35s cubic-bezier(.2,.7,.2,1);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(95,185,142,.5)}
.toast.bad{border-color:rgba(229,118,107,.5)}
.modal-bg{position:fixed;inset:0;background:rgba(4,10,20,.7);backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex;animation:fadein .2s both}
.modal{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:var(--shadow);animation:pop .25s both}
.modal h3{font-size:17px;margin-bottom:10px}
.modal p{color:var(--dim);font-size:13.5px;margin-bottom:16px}

.center-pad{padding:60px 0;text-align:center;color:var(--faint)}
.center-pad .spin{width:26px;height:26px;border:3px solid rgba(201,162,75,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}

.foot{text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:1px;padding:30px 0 10px}
.foot .tw{color:var(--gold);letter-spacing:3px;font-size:10.5px;margin-top:6px}

/* ============ ANIM ============ */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes swap{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes scanline{0%,100%{top:16%}50%{top:80%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.05s!important}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:120}

/* ============ PRINT ============ */
.print-only{display:none}
@media print{
  body.printing-report *{visibility:hidden!important}
  body.printing-report #repPrintArea,body.printing-report #repPrintArea *{visibility:visible!important}
  body.printing-report #repPrintArea{position:absolute;left:0;top:0;width:100%;display:block}
  body{background:#fff;color:#111}
  body::before,body::after{display:none}
  .topbar,.btnrow,.no-print,.foot,.adm-tabs,.searchbar,.progress{display:none!important}
  .wrap{max-width:100%;padding:0}
  .print-only{display:block}
  .card,.panel,.ticket,.kpi{box-shadow:none;border-color:#ccc;background:#fff!important;color:#111}
  .ticket .qrbox{border:1px solid #ccc}
  table.grid th{background:#eee;color:#111;position:static}
  table.grid td,table.grid th{border-color:#bbb}
  .trow span,.kpi .k{color:#555}
  .regid,.ticket .th b,.panel h3{color:#111!important}
  a[href]:after{content:""}
}
@page{size:A4;margin:14mm}
</style>

/* ---------- helpers ---------- */
var $ = function(s,r){return (r||document).querySelector(s)};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var el = function(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function digits(s){return String(s||"").replace(/\D/g,"");}
function fmtPhone(s){var d=digits(s).slice(0,10);var a=d.slice(0,3),b=d.slice(3,6),c=d.slice(6,10);return a+(b?"-"+b:"")+(c?"-"+c:"");}
function thb(n){return Number(n||0).toLocaleString("th-TH");}
function fullName(o){return ((o.r||o.prefix||"")+" "+(o.f||o.firstName||"")+" "+(o.l||o.lastName||"")).replace(/\s+/g," ").trim();}
function unitIsWing2(u){return String(u||"").trim()==="กองบิน 2";}
function eligibleForShirt(u){return !unitIsWing2(u);}  /* สังกัด != กองบิน 2 -> กรอกเสื้อได้ */
function now(){return new Date();}
function closed(){return now().getTime() > new Date(CONFIG.CLOSE_AT).getTime();}
function pad4(n){return ("000"+n).slice(-4);}

function toast(msg,kind){
  var t=$("#toast"); t.className="toast "+(kind||"")+" show"; t.textContent=msg;
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.className="toast "+(kind||"");},3200);
}
function modal(html){
  var bg=$("#modalBg"); $("#modal").innerHTML=html; bg.classList.add("open");
  bg.onclick=function(e){if(e.target===bg)closeModal();};
}
function closeModal(){$("#modalBg").classList.remove("open");}

/* ---------- API ---------- */
function api(action,payload){
  if(!CONFIG.API_URL || CONFIG.API_URL.indexOf("PASTE_YOUR")===0){
    return Promise.reject(new Error("ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html (ดู README-setup.md)"));
  }
  return fetch(CONFIG.API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action:action},payload||{}))
  }).then(function(r){return r.json();}).then(function(j){
    if(j && j.ok===false) throw new Error(j.error||"เกิดข้อผิดพลาด");
    return j;
  });
}

/* ---------- PromptPay dynamic QR ---------- */
function ppCRC(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return ("000"+c.toString(16).toUpperCase()).slice(-4);}
function ppField(id,v){return id+("0"+v.length).slice(-2)+v;}
function ppPayload(id13,amount){
  var acc=ppField("00","A000000677010111")+ppField("02",id13);
  var p=ppField("00","01")+ppField("01","12")+ppField("29",acc)+ppField("53","764");
  if(amount>0)p+=ppField("54",Number(amount).toFixed(2));
  p+=ppField("58","TH")+"6304";
  return p+ppCRC(p);
}
function qrSVG(text,ec){
  var q=qrcode(0,ec||"M"); q.addData(text); q.make();
  return q.createSvgTag({cellSize:4,margin:1,scalable:true});
}

  if(amountDue(S.reg)>0) steps.push("ชำระเงิน");
  return steps;

function stepNav(body,opts){

      '<div class="combo"><input class="inp" id="nameInp" autocomplete="off" placeholder="เช่น สมชาย หรือ ใจดี" value="'+esc(S.reg._picked?fullName(S.reg):"")+'"><div class="combo-list" id="comboList"></div></div>'+

      (r.genCHNO?'<div class="l"><span>รุ่น ชนอ.</span><b style="color:var(--text)">'+esc(r.genCHNO)+'</b></div>':'')+
      '<div class="l"><span>สังกัด</span><b style="color:var(--text)">'+esc(r.unit||"-")+'</b></div>'+
      (r.position?'<div class="l"><span>ตำแหน่ง</span><b style="color:var(--text)">'+esc(r.position)+'</b></div>':'')+
      '</div>'+
      (eligibleForShirt(r.unit)?'<div class="note-line">ท่านมีสิทธิ์สั่งเสื้อธีมงาน (มีขั้นตอนเลือกไซซ์)</div>':'<div class="note-line">สังกัดกองบิน 2 รับเสื้อผ่านหน่วยต้นสังกัด — ไม่ต้องกรอกไซซ์ในระบบ</div>');

    if(!S.reg._manual){manual.innerHTML="";return;}
    manual.innerHTML='<div class="rule"></div><div class="hint">กรอกข้อมูลของท่าน</div>'+
      '<div class="field"><label>ยศ <span class="req">*</span></label>'+
        '<select class="sel" id="mPrefix"><option value="">— เลือกยศ —</option>'+
        ["พล.อ.อ.","พล.อ.ท.","พล.อ.ต.","น.อ.(พ)","น.อ.","น.ท.","น.ต.","ร.อ.","ร.ท.","ร.ต.","ว่าที่ น.อ.","ว่าที่ น.ท.","จ.อ.","อื่น ๆ"].map(function(x){return '<option'+(S.reg.prefix===x?" selected":"")+'>'+x+'</option>';}).join("")+'</select></div>'+
      '<div class="field" style="display:flex;gap:10px"><div style="flex:1"><label>ชื่อ <span class="req">*</span></label><input class="inp" id="mFirst" value="'+esc(S.reg.firstName)+'"></div>'+

      '<div class="field" style="display:flex;gap:10px"><div style="flex:1"><label>รุ่น ชนอ. (นนอ.)</label><input class="inp" id="mCh" inputmode="numeric" value="'+esc(S.reg.genCHNO)+'"></div>'+
        '<div style="flex:1"><label>สังกัด <span class="req">*</span></label><select class="sel" id="mUnit">'+

    function sync(){ S.reg.prefix=$("#mPrefix").value; S.reg.firstName=$("#mFirst").value.trim(); S.reg.lastName=$("#mLast").value.trim(); S.reg.genCHNO=$("#mCh").value.trim(); S.reg.unit=$("#mUnit").value; showPicked(); }

  }
  function pick(r){
    S.reg.inRoster=true; S.reg._picked=true; S.reg._manual=false;
    S.reg.prefix=r.r; S.reg.firstName=r.f; S.reg.lastName=r.l; S.reg.genTT=r.tt; S.reg.genCHNO=r.ch; S.reg.unit=r.u; S.reg.position=r.p;
    inp.value=fullName(r); list.classList.remove("open"); fld.classList.remove("invalid");
    manual.innerHTML=""; showPicked();
  }
  function startManual(){
    S.reg.inRoster=false; S.reg._manual=true; S.reg._picked=false;
    S.reg.position=""; S.reg.genTT="";

  }
  function search(q){
    q=q.trim(); matches=[]; activeIdx=-1;
    if(q.length>=1){
      var toks=q.split(/\s+/).filter(Boolean);
      matches=ROSTER.filter(function(r){
        var hay=(r.r+" "+r.f+" "+r.l+" "+r.ch).toLowerCase();
        return toks.every(function(t){return hay.indexOf(t.toLowerCase())>=0;});
      }).slice(0,40);
    }
    var html=matches.map(function(r,i){
      var nm=esc(fullName(r)).replace(new RegExp("("+q.split(/\s+/).filter(Boolean).map(function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("|")+")","gi"),"<mark>$1</mark>");

  }

  inp.onfocus=function(){ if(inp.value.trim())search(inp.value); };
  inp.onkeydown=function(e){
    var opts=$$(".opt",list); if(!list.classList.contains("open")||!opts.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();activeIdx=Math.min(opts.length-1,activeIdx+1);}
    else if(e.key==="ArrowUp"){e.preventDefault();activeIdx=Math.max(0,activeIdx-1);}
    else if(e.key==="Enter"){e.preventDefault();if(opts[activeIdx])opts[activeIdx].click();return;}
    else return;
    opts.forEach(function(o,i){o.classList.toggle("active",i===activeIdx);});
    opts[activeIdx].scrollIntoView({block:"nearest"});
  };
  document.addEventListener("click",function(e){
    if(!document.body.contains(inp)) return; /* step no longer mounted */
    if(!e.target.closest || !e.target.closest(".combo")) list.classList.remove("open");
  });
  if(S.reg._manual) renderManual();
  showPicked();

  stepNav(body,{ onNext:function(){
    var ok = S.reg._picked || (S.reg._manual && S.reg.prefix && S.reg.firstName && S.reg.lastName && S.reg.unit);
    if(!ok){ fld.classList.add("invalid"); toast("กรุณาเลือกหรือกรอกชื่อให้ครบ","bad"); return; }
    S.step++; render();
  }});
}

        '<div class="filebtn'+(r.slipData?" has":"")+'" id="slipBtn">'+(r.slipData?"✓ แนบสลิปแล้ว — แตะเพื่อเปลี่ยน":"📎 แตะเพื่อเลือกรูปสลิป")+'</div>'+
        '<input type="file" id="slipFile" accept="image/*" hidden>'+
        '<div id="slipPrev">'+(r.slipData?'<div class="slip-prev"><img src="'+r.slipData+'"></div>':'')+'</div>'+
        '<div class="err">กรุณาแนบสลิปโอนเงิน</div></div>';

        fbtn.classList.add("has"); fbtn.textContent="✓ แนบสลิปแล้ว — แตะเพื่อเปลี่ยน";
        $("#slipPrev",d).innerHTML='<div class="slip-prev"><img src="'+dataUrl+'"></div>';
        fbtn.closest(".field").classList.remove("invalid");
      });
    };
  }
  detail();

    if(r.payMethod==="transfer" && !r.slipData){ $("#payDetail .field",body).classList.add("invalid"); toast("กรุณาแนบสลิปโอนเงิน","bad"); return; }
    submitReg(btn);
  }});

function resizeImage(file,maxDim,q,cb){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var w=img.width,h=img.height,sc=Math.min(1,maxDim/Math.max(w,h));
    var cv=el("canvas"); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    cb(cv.toDataURL("image/jpeg",q));
  };
  img.src=url;
}

function submitReg(btn){
  if(closed()){ toast("หมดเวลารับลงทะเบียนแล้ว","bad"); return; }

  var payload={
    regId:r.regId||"", inRoster:!!r.inRoster,
    prefix:r.prefix, firstName:r.firstName, lastName:r.lastName, genTT:r.genTT, genCHNO:r.genCHNO,
    unit:r.unit, position:r.position, phone:digits(r.phone),
    ownShirtSize: eligibleForShirt(r.unit)? r.ownShirtSize : "",
    extraShirts: eligibleForShirt(r.unit)? r.extraShirts : [],
    extraQty: eligibleForShirt(r.unit)? extraQty(r) : 0,
    amountDue: amountDue(r),
    payMethod: amountDue(r)>0 ? r.payMethod : "",
    payStatus: amountDue(r)>0 ? (r.payMethod==="cash"?"รอชำระ":"รอตรวจสอบ") : "",
    slipData: r.slipData||"",
    joinGolf:r.joinGolf==="เข้าร่วม"?"Y":"N", golfTravel:r.golfTravel||"",
    joinDinner:r.joinDinner==="เข้าร่วม"?"Y":"N", dinnerTravel:r.dinnerTravel||"",

  };
  btn.disabled=true; var old=btn.innerHTML; btn.innerHTML='<span class="spin"></span>กำลังบันทึก...';

      joinGolf:res.record.joinGolf==="Y"?"เข้าร่วม":"ไม่เข้าร่วม",

}

/* ---- SCANNER ---- */
function toggleScanner(body){
  var area=$("#ciScanArea",body);
  if(scanState.running){ stopScanner(); area.innerHTML=""; return; }
  area.innerHTML='<div class="scanwrap"><video id="scanVid" playsinline muted></video><div class="frame"></div><div class="laser"></div></div><div class="scan-result" id="scanMsg">เล็ง QR บนบัตรเข้างานให้อยู่ในกรอบ</div>';
  var vid=$("#scanVid",area);
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(stream){
    scanState.stream=stream; scanState.running=true; vid.srcObject=stream; vid.play();
    var cv=el("canvas"), ctx=cv.getContext("2d",{willReadFrequently:true});
    var detector=null;
    if("BarcodeDetector" in window){ try{ detector=new BarcodeDetector({formats:["qr_code"]}); }catch(e){} }
    function loop(){
      if(!scanState.running)return;
      if(vid.readyState===vid.HAVE_ENOUGH_DATA){
        cv.width=vid.videoWidth; cv.height=vid.videoHeight;
        ctx.drawImage(vid,0,0,cv.width,cv.height);
        if(detector){
          detector.detect(cv).then(function(codes){ if(codes&&codes[0]) onScan(codes[0].rawValue,body); }).catch(function(){});
        } else if(typeof jsQR==="function"){
          var img=ctx.getImageData(0,0,cv.width,cv.height);
          var code=jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
          if(code) onScan(code.data,body);
        }
      }
      scanState.raf=requestAnimationFrame(loop);
    }
    loop();
  }).catch(function(e){ area.innerHTML='<div class="note-line">เปิดกล้องไม่ได้: '+esc(e.message)+' — ใช้การค้นชื่อแทนได้</div>'; });
}
function stopScanner(){
  scanState.running=false;
  if(scanState.raf)cancelAnimationFrame(scanState.raf);
  if(scanState.stream)scanState.stream.getTracks().forEach(function(t){t.stop();});
  scanState.stream=null;
}
var lastScan={v:"",t:0};
function onScan(raw,body){
  var t=Date.now(); if(raw===lastScan.v && t-lastScan.t<2500)return; lastScan={v:raw,t:t};
  var reg="", parts=String(raw).split("|");
  if(parts[0]==="KKT"&&parts[1])reg=parts[1];
  else if(/^REG-\d+/i.test(raw))reg=raw.trim();
  var r=null;
  if(reg) r=ADM.data.find(function(x){return String(x.regId).toUpperCase()===reg.toUpperCase();});
  if(!r){ var d=digits(raw); if(d.length>=9) r=ADM.data.find(function(x){return digits(x.phone)===d;}); }
  var msg=$("#scanMsg",body);
  if(!r){ if(msg)msg.textContent="ไม่พบรายการจาก QR นี้ ("+esc(String(raw).slice(0,24))+")"; return; }
  beep();
  var box=$("#ciResults",body);
  box.innerHTML=ciPersonCard(r); bindCiCards(box);
  if(msg)msg.textContent="พบ: "+fullName(r)+" — ตรวจสอบแล้วกดเช็คอิน";
  box.scrollIntoView({behavior:"smooth",block:"center"});
}
function beep(){
  try{ var a=new (window.AudioContext||window.webkitAudioContext)(); var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type="sine";g.gain.value=.08;
    o.start();o.stop(a.currentTime+.12); }catch(e){}
}

function kpi(v,k,sub){ return '<div class="kpi"><div class="v" data-count="'+(typeof v==="number"?v:"")+'">'+(typeof v==="number"?"0":esc(v))+'</div><div class="k">'+esc(k)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'; }
function bar(label,v,max){
  var pct=Math.round((v/(max||1))*100);
  return '<div class="barrow"><div class="lb">'+esc(label)+'</div><div class="track"><div class="fill" data-w="'+pct+'"></div></div><div class="vv">'+v+'</div></div>';
}
function animateBars(scope){ setTimeout(function(){ $$(".fill",scope).forEach(function(f){ f.style.width=(f.dataset.w||0)+"%"; }); },60); }
function animateKpis(scope){
  $$(".kpi .v[data-count]",scope).forEach(function(e){
    var target=+e.dataset.count;
    if(!e.dataset.count){ return; }               /* non-numeric KPI: leave as-is */
    if(!target){ e.textContent="0"; return; }
    var start=Date.now(),dur=900;
    var iv=setInterval(function(){
      var p=Math.min(1,(Date.now()-start)/dur);
      e.textContent=Math.round(target*(1-Math.pow(1-p,3))).toLocaleString("th-TH");
      if(p>=1) clearInterval(iv);
    },30);
    setTimeout(function(){ clearInterval(iv); e.textContent=target.toLocaleString("th-TH"); },dur+400); /* guarantee final value */
  });
}
function shirtSummary(d){
  var m={};
  d.forEach(function(r){
    if(r.ownShirtSize){ m[r.ownShirtSize]=(m[r.ownShirtSize]||0)+1; }
    parseExtras(r.extraShirts).forEach(function(x){ if(x.size)m[x.size]=(m[x.size]||0)+(+x.qty||0); });
  });
  return m;
}
function donut(parts){
  var total=parts.reduce(function(a,p){return a+p[1];},0)||1, off=0, R=52, C=2*Math.PI*R;
  var segs=parts.map(function(p){
    var frac=p[1]/total, len=frac*C;
    var s='<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+p[2]+'" stroke-width="20" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 66 66)"/>';
    off+=len; return s;
  }).join("");
  var lg=parts.map(function(p){return '<div><i style="background:'+p[2]+'"></i>'+esc(p[0])+' · <b>'+p[1]+'</b></div>';}).join("");
  return '<svg viewBox="0 0 132 132">'+segs+'<circle cx="66" cy="66" r="30" fill="var(--bg2)"/><text x="66" y="72" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="700">'+total+'</text></svg><div class="lg">'+lg+'</div>';
}

    H=["รหัส","ยศ-ชื่อ-สกุล","รุ่นชนอ.","สังกัด","เบอร์","กอล์ฟ","เดินทางกอล์ฟ","งานเลี้ยง","เดินทางเลี้ยง","ไซซ์เสื้อ","สั่งเพิ่ม","ยอดค้าง","สถานะเงิน","แพ้อาหาร","เช็คอินกอล์ฟ","เช็คอินเลี้ยง"];
    rows=d.map(function(r){return [r.regId,fullName(r),r.genCHNO,r.unit,fmtPhone(r.phone),yn(r.joinGolf),r.golfTravel,yn(r.joinDinner),r.dinnerTravel,r.ownShirtSize,extrasText(r.extraShirts),r.amountDue||0,r.payStatus,r.allergy,fmtTime(r.checkinGolfAt),fmtTime(r.checkinDinnerAt)];});
  } else if(key==="golfbus"){
    title="รายชื่อขึ้นรถบัส บน.2 · รอบกอล์ฟ (ขึ้น "+CONFIG.BUS.place+" 0830)";
    var g=d.filter(function(r){return r.joinGolf==="Y"&&r.golfTravel==="รถบัส บน.2";});
    H=["ลำดับ","รหัส","ยศ-ชื่อ-สกุล","สังกัด","เบอร์","เช็คอิน"];
    rows=g.map(function(r,i){return [i+1,r.regId,fullName(r),r.unit,fmtPhone(r.phone),r.checkinGolfAt?"มาแล้ว":""];});
  } else if(key==="dinnerbus"){
    title="รายชื่อขึ้นรถบัส บน.2 · รอบงานเลี้ยง (ขึ้น "+CONFIG.BUS.place+" 1530)";
    var dn=d.filter(function(r){return r.joinDinner==="Y"&&r.dinnerTravel==="รถบัส บน.2";});
    H=["ลำดับ","รหัส","ยศ-ชื่อ-สกุล","สังกัด","เบอร์","เช็คอิน"];
    rows=dn.map(function(r,i){return [i+1,r.regId,fullName(r),r.unit,fmtPhone(r.phone),r.checkinDinnerAt?"มาแล้ว":""];});
  } else if(key==="shirts"){
    title="ใบสั่งผลิตเสื้อ ชนอ.บน.2 ปี 69";
    var sum=shirtSummary(d), lines=CONFIG.SIZES.filter(function(z){return sum[z.s];}).map(function(z){return [z.s,"อก "+z.c+'" / ยาว '+z.l+'"',sum[z.s]];});
    lines.push(["รวม","",Object.keys(sum).reduce(function(a,k){return a+sum[k];},0)]);
    H=["ไซซ์","ขนาด (นิ้ว)","จำนวน (ตัว)"]; rows=lines;
    return {title:title,H:H,rows:rows,extra:shirtDetailTable(d)};
  } else if(key==="payment"){
    title="สถานะการชำระเงินค่าเสื้อ";
    var p=d.filter(function(r){return +r.amountDue>0;});
    H=["รหัส","ยศ-ชื่อ-สกุล","สังกัด","เบอร์","สั่งเพิ่ม(ตัว)","ยอด(บาท)","ช่องทาง","สถานะ"];
    rows=p.map(function(r){return [r.regId,fullName(r),r.unit,fmtPhone(r.phone),r.extraQty||0,r.amountDue||0,r.payMethod==="cash"?"เงินสด":"โอน",r.payStatus];});
    var tot=p.reduce(function(a,r){return a+(+r.amountDue||0);},0), got=p.filter(function(r){return r.payStatus==="ชำระแล้ว";}).reduce(function(a,r){return a+(+r.amountDue||0);},0);
    rows.push(["","","","","รวม",tot,"เก็บแล้ว",got]);
  } else if(key==="allergy"){
    title="รายการผู้แจ้งแพ้อาหาร";
    var al=d.filter(function(r){return r.allergy;});
    H=["รหัส","ยศ-ชื่อ-สกุล","สังกัด","งานเลี้ยง","อาหารที่แพ้"];
    rows=al.map(function(r){return [r.regId,fullName(r),r.unit,r.joinDinner==="Y"?"เข้าร่วม":"ไม่",r.allergy];});
  } else if(key==="golf"||key==="dinner"){
    var isG=key==="golf";
    title="สถานะเช็คอิน · รอบ"+(isG?"กอล์ฟ":"งานเลี้ยง");
    var j=d.filter(function(r){return isG?r.joinGolf==="Y":r.joinDinner==="Y";});
    H=["รหัส","ยศ-ชื่อ-สกุล","สังกัด","เบอร์","สถานะ","เวลาเช็คอิน"];
    rows=j.map(function(r){var t=isG?r.checkinGolfAt:r.checkinDinnerAt;return [r.regId,fullName(r),r.unit,fmtPhone(r.phone),t?"มาแล้ว":"ยังไม่มา",fmtTime(t)];});
  }
  return {title:title,H:H,rows:rows};
}
function extrasText(v){ return parseExtras(v).map(function(x){return x.size+"×"+x.qty;}).join(", "); }
function shirtDetailTable(d){
  var list=d.filter(function(r){return r.ownShirtSize||parseExtras(r.extraShirts).length;});
  return '<h3 style="margin-top:18px">รายชื่อผู้สั่งเสื้อ</h3><table class="grid"><tr><th>รหัส</th><th>ชื่อ</th><th>สังกัด</th><th>ไซซ์ประจำตัว</th><th>สั่งเพิ่ม</th></tr>'+
    list.map(function(r){return '<tr><td>'+esc(r.regId)+'</td><td>'+esc(fullName(r))+'</td><td>'+esc(r.unit||"")+'</td><td>'+esc(r.ownShirtSize||"-")+'</td><td>'+esc(extrasText(r.extraShirts)||"-")+'</td></tr>';}).join("")+'</table>';
}
function buildReport(key,fmt){
  var def=reportDef(key);
  if(fmt==="xls"){ exportXls(def.title,def.H,def.rows); return; }
  var area=$("#repPrintArea");
  area.innerHTML='<div style="padding:6px 0 14px"><h2 style="font-size:18px">'+esc(def.title)+'</h2>'+
    '<div style="color:#555;font-size:12px">'+esc(CONFIG.EVENT_NAME)+' · '+esc(CONFIG.EVENT_DATE)+' · พิมพ์เมื่อ '+new Date().toLocaleString("th-TH")+' · รวม '+def.rows.length+' รายการ</div></div>'+
    '<table class="grid"><tr>'+def.H.map(function(h){return '<th>'+esc(h)+'</th>';}).join("")+'</tr>'+
    def.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c==null?"":c)+'</td>';}).join("")+'</tr>';}).join("")+'</table>'+
    (def.extra||"");
  document.body.classList.add("printing-report");
  window.print();
  setTimeout(function(){ area.innerHTML=""; document.body.classList.remove("printing-report"); },800);
}
function exportXls(name,H,rows){
  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>'+esc(name).slice(0,28)+'</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+
    '<table border="1"><tr>'+H.map(function(h){return '<th style="background:#c9a24b;color:#000">'+esc(h)+'</th>';}).join("")+'</tr>'+
    rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c==null?"":c)+'</td>';}).join("")+'</tr>';}).join("")+'</table></body></html>';
  var blob=new Blob(["\ufeff"+html],{type:"application/vnd.ms-excel"});
  var a=el("a"); a.href=URL.createObjectURL(blob);
  a.download=name.replace(/[\\/:*?"<>|]/g,"").slice(0,60)+" - "+CONFIG.EVENT_NAME+".xls";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast("ดาวน์โหลดไฟล์ Excel แล้ว","ok");
}

/* ===================================================================== */
/*  CONFETTI                                                              */
/* ===================================================================== */
function burst(){
  var cv=$("#confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  var cols=["#c9a24b","#e7c980","#ffffff","#5fb98e","#3a6ea5"], P=[];
  for(var i=0;i<140;i++)P.push({x:innerWidth/2,y:innerHeight*0.32,vx:(Math.random()-.5)*13,vy:Math.random()*-13-4,g:.32+Math.random()*.2,r:Math.random()*6+3,c:cols[i%cols.length],a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.4});
  var t0=null;
  function fr(ts){ t0=t0||ts; var e=ts-t0; ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a=Math.max(0,1-e/2600);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=p.a; ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); });
    if(e<2600)requestAnimationFrame(fr); else ctx.clearRect(0,0,cv.width,cv.height);
  }
  requestAnimationFrame(fr);
  setTimeout(function(){ try{ ctx.clearRect(0,0,cv.width,cv.height); }catch(e){} },3200); /* กันเศษค้างจอกรณีสลับแท็บ */
}

(function boot(){

  var h=location.hash.replace("#","");
  if(h==="admin") S.view=S.admin?"admin":"adminLogin";

    var v=location.hash.replace("#","");
    if(v==="admin"){ go(S.admin?"admin":"adminLogin"); }
    else if(v===""||v==="home"){ go("home"); }
  });
  window.addEventListener("beforeunload",function(){ if(scanState.running)stopScanner(); });
})();
